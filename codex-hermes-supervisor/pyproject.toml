[project]
name = "codex-hermes-supervisor"
version = "0.1.0"
description = "Python sidecar supervisor for Codex App, Hermes memory, versioned files, and Official LLM Wiki over Obsidian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "rich>=13.0",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
chs = "codex_hermes_supervisor.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
